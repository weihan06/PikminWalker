                  setContentView(R.layout.activity_main)

                  map = findViewById(R.id.map)
                  tvStatus = findViewById(R.id.tvStatus)
                  tvHint = findViewById(R.id.tvHint)
                  etCoord = findViewById(R.id.etCoord)
                  etSpeed = findViewById(R.id.etSpeed)
                  cbLoop = findViewById(R.id.cbLoop)
                  btnPrimary = findViewById(R.id.btnPrimary)
                  btnPause = findViewById(R.id.btnPause)
                  rowRoute = findViewById(R.id.rowRoute)
                  btnLayer = findViewById(R.id.btnLayer)

                  setupMap()
                  setupButtons()
                  // 第一次使用或設定沒完成時，自動開啟設定導覽
                  if (savedInstanceState == null && !SetupUtil.allDone(this)) openSetupGuide()
                  // 點上方狀態列可隨時重新開啟設定導覽
                  tvStatus.setOnClickListener { openSetupGuide() }
                  observeState()
              }

              // ---------------- 地圖 ----------------

              private fun setupMap() {
                  tileIdx = prefs.getInt("tile_idx", 0).coerceIn(0, tileSources.size - 1)
                  applyTiles()
                  map.setMultiTouchControls(true)
                  map.zoomController.setVisibility(org.osmdroid.views.CustomZoomButtonsController.Visibility.NEVER)
                  map.controller.setZoom(17.0)
                  // 預設：上次位置，沒有就台南火車站
                  val lat = prefs.getFloat("last_lat", 22.9971f).toDouble()
                  val lng = prefs.getFloat("last_lng", 120.2128f).toDouble()
                  map.controller.setCenter(GeoPoint(lat, lng))

                  routeLine = Polyline(map).apply {
                      outlinePaint.color = Color.parseColor("#2E7D32")
                      outlinePaint.strokeWidth = 10f
                  }
                  map.overlays.add(routeLine)

                  val receiver = object : MapEventsReceiver {
                      override fun singleTapConfirmedHelper(p: GeoPoint): Boolean {
                          onMapTap(p); return true
                      }
                      override fun longPressHelper(p: GeoPoint): Boolean = false
                  }
                  map.overlays.add(0, MapEventsOverlay(receiver))
              }

              private fun onMapTap(p: GeoPoint) {
                  if (routeMode) addWaypoint(p) else setJumpTarget(p)
              }

              private fun setJumpTarget(p: GeoPoint) {
                  jumpTarget = p
                  if (jumpMarker == null) {
                      jumpMarker = Marker(map).apply {
                          icon = labelIcon("★", Color.parseColor("#F9A825"))
                          setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_CENTER)
                          isDraggable = true
                          setOnMarkerDragListener(object : Marker.OnMarkerDragListener {
                              override fun onMarkerDrag(m: Marker) {}
                              override fun onMarkerDragStart(m: Marker) {}
                              override fun onMarkerDragEnd(m: Marker) { jumpTarget = m.position; updateHint() }
                          })
                      }
                      map.overlays.add(jumpMarker)
                  }
                  jumpMarker!!.position = p
                  updateHint()
                  map.invalidate()
              }

              private fun addWaypoint(p: GeoPoint) {
                  waypoints.add(p)
                  val idx = waypoints.size - 1
                  val m = Marker(map).apply {
                      position = p
                      icon = labelIcon(letter(idx), Color.parseColor("#1565C0"))
                      setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_CENTER)
                      isDraggable = true
                      setOnMarkerDragListener(object : Marker.OnMarkerDragListener {
                          override fun onMarkerDrag(m: Marker) {}
                          override fun onMarkerDragStart(m: Marker) {}
                          override fun onMarkerDragEnd(m: Marker) {
                              val i = waypointMarkers.indexOf(m)
                              if (i >= 0) { waypoints[i] = m.position; redrawRoute() }
                          }
                      })
                  }
                  waypointMarkers.add(m)
                  map.overlays.add(m)
                  redrawRoute()
              }

              private fun redrawRoute() {
                  routeLine.setPoints(waypoints.toList())
                  updateHint()
                  map.invalidate()
              }

              private fun clearRoute() {
                  waypointMarkers.forEach { map.overlays.remove(it) }
                  waypointMarkers.clear()
                  waypoints.clear()
                  redrawRoute()
              }

              private fun undoWaypoint() {
                  if (waypoints.isEmpty()) return
                  map.overlays.remove(waypointMarkers.removeAt(waypointMarkers.size - 1))
                  waypoints.removeAt(waypoints.size - 1)
                  redrawRoute()
              }

              // ---------------- 按鈕 ----------------

              private fun setupButtons() {
                  findViewById<MaterialButtonToggleGroup>(R.id.toggleMode)
                      .addOnButtonCheckedListener { _, id, checked ->
                          if (!checked) return@addOnButtonCheckedListener
                          routeMode = id == R.id.btnModeRoute
                          rowRoute.visibility = if (routeMode) View.VISIBLE else View.GONE
                          btnPrimary.text = if (routeMode) "開始走" else "移動到這裡"
                          jumpMarker?.setVisible(!routeMode)
                          updateHint()
                          map.invalidate()
                      }

                  btnPrimary.setOnClickListener { if (routeMode) startRoute() else teleport() }

                  btnPause.setOnClickListener {
                      if (!MockState.walking.value) {
                          toast("目前沒有在走路線"); return@setOnClickListener
                      }
                      sendToService(if (MockState.paused.value) MockLocationService.ACTION_RESUME
                                    else MockLocationService.ACTION_PAUSE)
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      if (MockState.current.value != null) sendToService(MockLocationService.ACTION_STOP)
                  }

                  findViewById<Button>(R.id.btnLocate).setOnClickListener {
                      val mock = MockState.current.value
                      val real = realLoc
                      when {
                          mock != null -> map.controller.animateTo(GeoPoint(mock.lat, mock.lng))
                          real != null -> map.controller.animateTo(GeoPoint(real.latitude, real.longitude))
                          else -> toast("還沒抓到 GPS 位置")
                      }
                  }

                  findViewById<Button>(R.id.btnGo).setOnClickListener { goToTypedCoord() }
                  btnLayer.setOnClickListener {
                      tileIdx = (tileIdx + 1) % tileSources.size
                      prefs.edit().putInt("tile_idx", tileIdx).apply()
                      applyTiles()
                  }
                  findViewById<Button>(R.id.btnUndo).setOnClickListener { undoWaypoint() }
                  findViewById<Button>(R.id.btnClear).setOnClickListener { clearRoute() }
              }

              /** 解析「22.99, 120.21」這類座標（可直接貼 Google 地圖複製的座標） */
              private fun goToTypedCoord() {
                  val parts = etCoord.text.toString()
                      .replace("(", "").replace(")", "")
                      .split(",", " ", "，").filter { it.isNotBlank() }
                  val lat = parts.getOrNull(0)?.toDoubleOrNull()
                  val lng = parts.getOrNull(1)?.toDoubleOrNull()
                  if (lat == null || lng == null || lat !in -90.0..90.0 || lng !in -180.0..180.0) {
                      toast("座標格式錯誤，請輸入「緯度, 經度」"); return
                  }
                  val p = GeoPoint(lat, lng)
                  map.controller.animateTo(p)
                  onMapTap(p)
              }

              private fun teleport() {
                  val t = jumpTarget ?: run { toast("請先在地圖上點選目的地"); return }
                  if (!checkReady()) return
                  val cur = MockState.current.value
                  if (cur != null) {
                      val d = dist(cur.lat, cur.lng, t.latitude, t.longitude)
                      if (d > 2000) toast("距離 %.1f km，大距離瞬移建議等一段時間再操作遊戲".format(d / 1000))
                  }
                  startService(Intent(this, MockLocationService::class.java).apply {
                      action = MockLocationService.ACTION_TELEPORT
                      putExtra(MockLocationService.EXTRA_LAT, t.latitude)
                      putExtra(MockLocationService.EXTRA_LNG, t.longitude)
                  }, foreground = true)
              }

              private fun startRoute() {
                  if (waypoints.size < 2) { toast("請至少在地圖上點兩個點（A → B）"); return }
                  val speed = etSpeed.text.toString().toDoubleOrNull()
                  if (speed == null || speed <= 0) { toast("請輸入速度"); return }
                  if (speed > 10) toast("提醒：皮克敏一般認為時速超過約 10 km/h 步數不會計算")
                  if (!checkReady()) return
                  startService(Intent(this, MockLocationService::class.java).apply {
                      action = MockLocationService.ACTION_ROUTE
                      putExtra(MockLocationService.EXTRA_LATS, waypoints.map { it.latitude }.toDoubleArray())
                      putExtra(MockLocationService.EXTRA_LNGS, waypoints.map { it.longitude }.toDoubleArray())
                      putExtra(MockLocationService.EXTRA_SPEED_KMH, speed)
                      putExtra(MockLocationService.EXTRA_LOOP, cbLoop.isChecked)
                  }, foreground = true)
              }

              private fun sendToService(action: String) {
                  startService(Intent(this, MockLocationService::class.java).setAction(action), foreground = false)
              }

              private fun startService(i: Intent, foreground: Boolean) {
                  if (foreground) ContextCompat.startForegroundService(this, i) else startService(i)
              }

              // ---------------- 狀態顯示 ----------------

              private fun observeState() {
                  lifecycleScope.launch {
                      repeatOnLifecycle(Lifecycle.State.STARTED) {
                          launch {
                              MockState.current.collect { pos ->
                                  if (pos == null) {
                                      meMarker?.let { map.overlays.remove(it) }
                                      meMarker = null
                                      firstFix = true
                                      startRealGps()
                                  } else {
                                      stopRealGps()
                                      val gp = GeoPoint(pos.lat, pos.lng)
                                      if (meMarker == null) {
                                          meMarker = Marker(map).apply {
                                              icon = labelIcon("我", Color.parseColor("#C62828"))
                                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_CENTER)
                                              infoWindow = null
                                          }
                                          map.overlays.add(meMarker)
                                      }
                                      meMarker!!.position = gp
                                      if (firstFix) { map.controller.animateTo(gp); firstFix = false }
                                      prefs.edit().putFloat("last_lat", pos.lat.toFloat())
                                          .putFloat("last_lng", pos.lng.toFloat()).apply()
                                  }
                                  map.invalidate()
                              }
                          }
                          launch {
                              combine(MockState.status, MockState.current, MockState.remainingMeters,
                                  MockState.walking, realText) { s, c, r, w, real ->
                                  buildString {
                                      append(s)
                                      if (c != null) append("\n目前：%.6f, %.6f".format(c.lat, c.lng))
                                      else if (real.isNotEmpty()) append("\n").append(real)
                                      if (w && r > 0) append("\n剩餘 %.0f 公尺".format(r))
                                  }
                              }.collect { tvStatus.text = it }
                          }
                          launch {
                              MockState.paused.collect { btnPause.text = if (it) "繼續" else "暫停" }
                          }
                      }
                  }
              }

              private fun updateHint() {
                  tvHint.text = if (routeMode) {
                      if (waypoints.size < 2) {
                          "點地圖依序加入路線點（A、B、C、D…），可拖曳點調整位置"
                      } else {
                          var total = 0.0
                          for (i in 0 until waypoints.size - 1) {
                              total += dist(waypoints[i].latitude, waypoints[i].longitude,
                                  waypoints[i + 1].latitude, waypoints[i + 1].longitude)
                          }
                          val speed = etSpeed.text.toString().toDoubleOrNull() ?: 5.0
                          val min = total / 1000 / speed * 60
                          "共 %d 點，全長 %.2f km，約 %.0f 分鐘（%.1f km/h）".format(waypoints.size, total / 1000, min, speed)
                      }
                  } else {
                      jumpTarget?.let { "目的地：%.6f, %.6f".format(it.latitude, it.longitude) }
                          ?: "點地圖選擇目的地，再按「移動到這裡」"
                  }
              }

              // ---------------- 真實 GPS（沒模擬時顯示） ----------------

              @SuppressLint("MissingPermission")
              private fun startRealGps() {
                  if (listeningReal || MockState.current.value != null) return
                  if (!SetupUtil.hasLocationPermission(this)) {
                      realText.value = "真實 GPS：尚未允許位置權限"
                      return
                  }
                  listeningReal = true
                  if (realLoc == null) realText.value = "真實 GPS：定位中…"
                  // 先用最後已知位置快速顯示
                  for (p in listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)) {
                      try { lm.getLastKnownLocation(p)?.let { onRealLocation(it) } } catch (_: Exception) {}
                  }
                  for (p in listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)) {
                      try {
                          if (lm.isProviderEnabled(p)) {
                              lm.requestLocationUpdates(p, 2000L, 0f, realListener, Looper.getMainLooper())
                          }
                      } catch (_: Exception) {}
                  }
                  if (!lm.isProviderEnabled(LocationManager.GPS_PROVIDER) &&
                      !lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {
                      realText.value = "真實 GPS：手機定位功能已關閉"
                  }
              }

              private fun stopRealGps() {
                  if (listeningReal) {
                      try { lm.removeUpdates(realListener) } catch (_: Exception) {}
                      listeningReal = false
                  }
                  realMarker?.let { map.overlays.remove(it) }
                  realMarker = null
                  realText.value = ""
              }

              private fun onRealLocation(loc: Location) {
                  if (MockState.current.value != null) return
                  // 忽略模擬出來的位置
                  val isMock = if (Build.VERSION.SDK_INT >= 31) loc.isMock else {
                      @Suppress("DEPRECATION") loc.isFromMockProvider
                  }
                  if (isMock) return
                  // 有 10 秒內的 GPS 定位時，不要被較不準的網路定位蓋掉
                  val prev = realLoc
                  if (prev != null && prev.provider == LocationManager.GPS_PROVIDER &&
                      loc.provider != LocationManager.GPS_PROVIDER &&
                      (loc.elapsedRealtimeNanos - prev.elapsedRealtimeNanos) < 10_000_000_000L) return

                  realLoc = loc
                  val ageSec = (SystemClock.elapsedRealtimeNanos() - loc.elapsedRealtimeNanos) / 1_000_000_000L
                  val src = if (loc.provider == LocationManager.GPS_PROVIDER) "GPS" else "網路"
                  realText.value = buildString {
                      append("真實 GPS：%.6f, %.6f".format(loc.latitude, loc.longitude))
                      append("\n（%s，誤差約 ±%.0f 公尺".format(src, loc.accuracy))
                      if (ageSec > 30) append("，%d 秒前".format(ageSec))
                      append("）")
                  }

                  val gp = GeoPoint(loc.latitude, loc.longitude)
                  if (realMarker == null) {
                      realMarker = Marker(map).apply {
                          icon = labelIcon("真", Color.parseColor("#1565C0"))
                          setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_CENTER)
                          infoWindow = null
                      }
                      map.overlays.add(realMarker)
                  }
                  realMarker!!.position = gp
                  if (firstRealFix) { map.controller.animateTo(gp); firstRealFix = false }
                  map.invalidate()
              }

              // ---------------- 權限與檢查 ----------------

              private fun openSetupGuide() {
                  startActivity(Intent(this, SetupActivity::class.java))
              }

              /** 設定沒完成就打開設定導覽 */
              private fun checkReady(): Boolean {
                  if (!SetupUtil.allDone(this)) {
                      toast("還有設定沒完成，請依照導覽操作")
                      openSetupGuide()
                      return false
                  }
                  return true
              }

              // ---------------- 小工具 ----------------

              private fun letter(i: Int): String =
                  if (i < 26) ('A' + i).toString() else "${i + 1}"

              private fun labelIcon(text: String, color: Int): BitmapDrawable {
                  val size = (resources.displayMetrics.density * 30).toInt()
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.color = Color.WHITE
                  c.drawCircle(size / 2f, size / 2f, size / 2f, p)
                  p.color = color
                  c.drawCircle(size / 2f, size / 2f, size / 2f - size * 0.08f, p)
                  p.color = Color.WHITE
                  p.textSize = size * 0.5f
                  p.textAlign = Paint.Align.CENTER
                  p.isFakeBoldText = true
                  val y = size / 2f - (p.descent() + p.ascent()) / 2
                  c.drawText(text, size / 2f, y, p)
                  return BitmapDrawable(resources, bmp)
              }

              private fun dist(a: Double, b: Double, c: Double, d: Double): Double {
                  val r = FloatArray(1)
                  Location.distanceBetween(a, b, c, d, r)
                  return r[0].toDouble()
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              override fun onResume() {
                  super.onResume()
                  map.onResume()
                  if (MockState.current.value == null) startRealGps()
              }

              override fun onPause() {
                  super.onPause()
                  map.onPause()
                  if (listeningReal) {
                      try { lm.removeUpdates(realListener) } catch (_: Exception) {}
                      listeningReal = false
                  }
              }
          }
          __PW_EOF__
          # 固定簽章金鑰（讓 App 可以直接覆蓋更新）
          echo '' | base64 -d > app/release.jks
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PikminWalker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
