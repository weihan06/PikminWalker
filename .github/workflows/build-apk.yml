          package com.example.pikminwalker

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.location.Location
          import android.location.LocationManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import androidx.core.app.NotificationCompat
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin
          import kotlin.random.Random

          /**
           * 前景服務：每秒把模擬位置送進 GPS / Network 測試提供者。
           * 支援「瞬移」與「沿路線依速度移動」。
           */
          class MockLocationService : Service() {

              companion object {
                  const val ACTION_TELEPORT = "teleport"
                  const val ACTION_ROUTE = "route"
                  const val ACTION_PAUSE = "pause"
                  const val ACTION_RESUME = "resume"
                  const val ACTION_STOP = "stop"

                  const val EXTRA_LAT = "lat"
                  const val EXTRA_LNG = "lng"
                  const val EXTRA_LATS = "lats"
                  const val EXTRA_LNGS = "lngs"
                  const val EXTRA_SPEED_KMH = "speed"
                  const val EXTRA_LOOP = "loop"

                  private const val CHANNEL_ID = "mock_location"
                  private const val NOTIFY_ID = 1
                  private const val TICK_MS = 1000L

                  private val PROVIDERS = listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)
              }

              private lateinit var lm: LocationManager
              private val handler = Handler(Looper.getMainLooper())
              private var providersReady = false

              // 目前位置
              private var lat = 0.0
              private var lng = 0.0
              private var bearing = 0f
              private var speedMs = 0f
              private var hasPosition = false

              // 路線狀態
              private var route: List<MockState.Pos> = emptyList()
              private var segIndex = 0
              private var segOffset = 0.0 // 在目前路段已走的公尺
              private var targetSpeedMs = 5.0 / 3.6
              private var loop = false
              private var walking = false
              private var paused = false

              private val tick = object : Runnable {
                  override fun run() {
                      if (walking && !paused) step(TICK_MS / 1000.0)
                      push()
                      handler.postDelayed(this, TICK_MS)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  createChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startAsForeground()

                  if (!providersReady) {
                      providersReady = setupProviders()
                      if (!providersReady) {
                          MockState.status.value = "❌ 無法模擬位置：請到「開發人員選項 → 選取模擬位置應用程式」選本 App"
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      handler.post(tick)
                  }

                  when (intent?.action) {
                      ACTION_TELEPORT -> {
                          walking = false
                          paused = false
                          lat = intent.getDoubleExtra(EXTRA_LAT, lat)
                          lng = intent.getDoubleExtra(EXTRA_LNG, lng)
                          speedMs = 0f
                          hasPosition = true
                          MockState.status.value = "已瞬移到 %.6f, %.6f".format(lat, lng)
                          MockState.remainingMeters.value = 0.0
                          push()
                      }

                      ACTION_ROUTE -> {
                          val lats = intent.getDoubleArrayExtra(EXTRA_LATS) ?: return START_STICKY
                          val lngs = intent.getDoubleArrayExtra(EXTRA_LNGS) ?: return START_STICKY
                          if (lats.size < 2) return START_STICKY
                          route = lats.indices.map { MockState.Pos(lats[it], lngs[it]) }
                          targetSpeedMs = max(0.5, intent.getDoubleExtra(EXTRA_SPEED_KMH, 5.0)) / 3.6
                          loop = intent.getBooleanExtra(EXTRA_LOOP, false)
                          segIndex = 0
                          segOffset = 0.0
                          lat = route[0].lat
                          lng = route[0].lng
                          hasPosition = true
                          walking = true
                          paused = false
                          MockState.status.value = "🚶 開始沿路線移動（%.1f km/h）".format(targetSpeedMs * 3.6)
                          push()
                      }

                      ACTION_PAUSE -> {
                          paused = true
                          speedMs = 0f
                          MockState.status.value = "⏸ 已暫停（位置停在原地）"
                      }

                      ACTION_RESUME -> {
                          paused = false
                          MockState.status.value = "🚶 繼續移動"
                      }

                      ACTION_STOP -> {
                          stopSelf()
                          return START_NOT_STICKY
                      }
                  }
                  MockState.walking.value = walking
                  MockState.paused.value = paused
                  updateNotification()
                  return START_STICKY
              }

              /** 沿路線前進 dt 秒 */
              private fun step(dt: Double) {
                  // 速度加入 ±8% 的小變化，看起來比較像真人走路
                  val v = targetSpeedMs * (1.0 + Random.nextDouble(-0.08, 0.08))
                  var remaining = v * dt

                  while (remaining > 0) {
                      if (segIndex >= route.size - 1) {
                          if (loop) {
                              route = route.reversed() // 走到終點就原路折返
                              segIndex = 0
                              segOffset = 0.0
                          } else {
                              finishRoute()
                              return
                          }
                      }
                      val a = route[segIndex]
                      val b = route[segIndex + 1]
                      val segLen = distance(a, b)
                      val left = segLen - segOffset
                      if (remaining < left) {
                          segOffset += remaining
                          remaining = 0.0
                      } else {
                          remaining -= left
                          segIndex++
                          segOffset = 0.0
                      }
                  }

                  if (segIndex >= route.size - 1) {
                      if (!loop) { finishRoute(); return }
                      lat = route.last().lat
                      lng = route.last().lng
                  } else {
                      val a = route[segIndex]
                      val b = route[segIndex + 1]
                      val segLen = distance(a, b)
                      val f = if (segLen > 0) segOffset / segLen else 1.0
                      lat = a.lat + (b.lat - a.lat) * f
                      lng = a.lng + (b.lng - a.lng) * f
                      bearing = bearing(a, b)
                  }
                  speedMs = v.toFloat()
                  MockState.remainingMeters.value = remainingDistance()
              }

              private fun finishRoute() {
                  val end = route.last()
                  lat = end.lat
                  lng = end.lng
                  walking = false
                  speedMs = 0f
                  MockState.walking.value = false
                  MockState.remainingMeters.value = 0.0
                  MockState.status.value = "🏁 已抵達終點，停留在終點位置"
                  updateNotification()
              }

              private fun remainingDistance(): Double {
                  if (segIndex >= route.size - 1) return 0.0
                  var d = distance(route[segIndex], route[segIndex + 1]) - segOffset
                  for (i in segIndex + 1 until route.size - 1) d += distance(route[i], route[i + 1])
                  return max(0.0, d)
              }

              /** 把目前位置送給系統 */
              private fun push() {
                  if (!hasPosition || !providersReady) return
                  val now = System.currentTimeMillis()
                  val elapsed = SystemClock.elapsedRealtimeNanos()
                  for (p in PROVIDERS) {
                      val loc = Location(p).apply {
                          latitude = lat
                          longitude = lng
                          altitude = 20.0
                          accuracy = 3f + Random.nextFloat() * 2f
                          time = now
                          elapsedRealtimeNanos = elapsed
                          bearing = this@MockLocationService.bearing
                          speed = speedMs
                          bearingAccuracyDegrees = 10f
                          speedAccuracyMetersPerSecond = 0.5f
                          verticalAccuracyMeters = 5f
                      }
                      try {
                          lm.setTestProviderLocation(p, loc)
                      } catch (_: Exception) {
                      }
                  }
                  MockState.current.value = MockState.Pos(lat, lng)
              }

              private fun setupProviders(): Boolean {
                  for (p in PROVIDERS) {
                      try {
                          try { lm.removeTestProvider(p) } catch (_: Exception) {}
                          @Suppress("DEPRECATION", "WrongConstant")
                          lm.addTestProvider(
                              p,
                              false, false, false, false,
                              true, true, true,
                              1, // POWER_USAGE_LOW
                              1  // ACCURACY_FINE
                          )
                          lm.setTestProviderEnabled(p, true)
                      } catch (e: SecurityException) {
                          return false
                      } catch (_: Exception) {
                          // 某些手機沒有 network provider，略過即可
                      }
                  }
                  return true
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  if (providersReady) {
                      for (p in PROVIDERS) {
                          try { lm.setTestProviderEnabled(p, false) } catch (_: Exception) {}
                          try { lm.removeTestProvider(p) } catch (_: Exception) {}
                      }
                  }
                  MockState.current.value = null
                  MockState.walking.value = false
                  MockState.paused.value = false
                  MockState.remainingMeters.value = 0.0
                  if (providersReady) MockState.status.value = "已停止模擬，恢復真實 GPS"
                  super.onDestroy()
              }

              // ---------- 通知 ----------

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(CHANNEL_ID, "模擬位置", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  }
              }

              private fun buildNotification(): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, MockLocationService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val text = when {
                      walking && paused -> "路線移動已暫停"
                      walking -> "沿路線移動中"
                      else -> "模擬位置中"
                  }
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_notify)
                      .setContentTitle("皮克敏散步助手")
                      .setContentText(text)
                      .setOngoing(true)
                      .setContentIntent(open)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "停止模擬", stop)
                      .build()
              }

              private fun startAsForeground() {
                  val n = buildNotification()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFY_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                  } else {
                      startForeground(NOTIFY_ID, n)
                  }
              }

              private fun updateNotification() {
                  getSystemService(NotificationManager::class.java).notify(NOTIFY_ID, buildNotification())
              }

              // ---------- 幾何 ----------

              private fun distance(a: MockState.Pos, b: MockState.Pos): Double {
                  val r = FloatArray(1)
                  Location.distanceBetween(a.lat, a.lng, b.lat, b.lng, r)
                  return r[0].toDouble()
              }

              private fun bearing(a: MockState.Pos, b: MockState.Pos): Float {
                  val p1 = Math.toRadians(a.lat)
                  val p2 = Math.toRadians(b.lat)
                  val dl = Math.toRadians(b.lng - a.lng)
                  val y = sin(dl) * cos(p2)
                  val x = cos(p1) * sin(p2) - sin(p1) * cos(p2) * cos(dl)
                  return ((Math.toDegrees(atan2(y, x)) + 360) % 360).toFloat()
              }
          }
