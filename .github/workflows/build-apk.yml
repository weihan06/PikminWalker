          cat > app/src/main/java/com/example/pikminwalker/MockState.kt <<'__PW_EOF__'
          package com.example.pikminwalker

          import kotlinx.coroutines.flow.MutableStateFlow

          /** Service 與畫面之間共用的狀態 */
          object MockState {
              data class Pos(val lat: Double, val lng: Double)

              /** 目前送出的模擬位置（null = 沒在模擬） */
              val current = MutableStateFlow<Pos?>(null)

              /** 狀態說明文字 */
              val status = MutableStateFlow("尚未開始模擬（點這裡可開啟設定導覽）")

              /** 是否正在走路線 */
              val walking = MutableStateFlow(false)

              /** 是否暫停 */
              val paused = MutableStateFlow(false)

              /** 路線剩餘距離（公尺） */
              val remainingMeters = MutableStateFlow(0.0)
          }
          __PW_EOF__
          mkdir -p app/src/main/java/com/example/pikminwalker
          cat > app/src/main/java/com/example/pikminwalker/SetupUtil.kt <<'__PW_EOF__'
          package com.example.pikminwalker

          import android.Manifest
          import android.app.AppOpsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import androidx.core.content.ContextCompat

          /** 檢查與開啟各項系統設定 */
          object SetupUtil {

              /** 開發人員選項是否已開啟 */
              fun isDeveloperEnabled(ctx: Context): Boolean = try {
                  Settings.Global.getInt(ctx.contentResolver, Settings.Global.DEVELOPMENT_SETTINGS_ENABLED, 0) == 1
              } catch (_: Exception) {
                  false
              }

              /** 本 App 是否已被選為模擬位置應用程式 */
              fun isMockAppSelected(ctx: Context): Boolean = try {
                  val ops = ctx.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = if (Build.VERSION.SDK_INT >= 29) {
                      ops.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_MOCK_LOCATION, Process.myUid(), ctx.packageName)
                  } else {
                      @Suppress("DEPRECATION")
                      ops.checkOpNoThrow(AppOpsManager.OPSTR_MOCK_LOCATION, Process.myUid(), ctx.packageName)
                  }
                  mode == AppOpsManager.MODE_ALLOWED
              } catch (_: Exception) {
                  false
              }

              fun requiredPermissions(): Array<String> {
                  val perms = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  return perms.toTypedArray()
              }

              fun missingPermissions(ctx: Context): Array<String> =
                  requiredPermissions().filter {
                      ContextCompat.checkSelfPermission(ctx, it) != PackageManager.PERMISSION_GRANTED
                  }.toTypedArray()

              /** 位置權限一定要有；通知權限沒給也能用，只是看不到通知 */
              fun hasLocationPermission(ctx: Context): Boolean =
                  ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_FINE_LOCATION) ==
                      PackageManager.PERMISSION_GRANTED

              fun allDone(ctx: Context): Boolean =
                  isMockAppSelected(ctx) && hasLocationPermission(ctx)

              /** 開啟「關於手機」 */
              fun openAboutPhone(ctx: Context) {
                  tryStart(ctx, Intent(Settings.ACTION_DEVICE_INFO_SETTINGS))
                      || tryStart(ctx, Intent(Settings.ACTION_SETTINGS))
              }

              /**
               * 直接開啟開發人員選項，並嘗試自動捲動並標示「選取模擬位置應用程式」那一列
               * （原生 Android 與多數品牌支援；不支援的手機會停在開發人員選項頁面最上方）
               */
              fun openMockLocationSetting(ctx: Context) {
                  val key = "mock_location_app"
                  val intent = Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS).apply {
                      putExtra(":settings:fragment_args_key", key)
                      putExtra(":settings:show_fragment_args", Bundle().apply {
                          putString(":settings:fragment_args_key", key)
                      })
                  }
                  tryStart(ctx, intent) || tryStart(ctx, Intent(Settings.ACTION_SETTINGS))
              }

              private fun tryStart(ctx: Context, i: Intent): Boolean = try {
                  ctx.startActivity(i); true
              } catch (_: Exception) {
                  false
              }
          }
