          package com.example.pikminwalker

          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          /**
           * 設定導覽：一步一步帶使用者完成
           * 1. 開啟開發人員選項  2. 選取模擬位置應用程式  3. 允許權限
           * 每次回到此畫面都會自動檢查，完成的步驟會自動跳到下一步。
           */
          class SetupActivity : AppCompatActivity() {

              private class Step(
                  val title: String,
                  val body: String,
                  val button: String,
                  val isDone: () -> Boolean,
                  val action: () -> Unit
              )

              private lateinit var steps: List<Step>
              private var index = 0

              private lateinit var tvDots: TextView
              private lateinit var tvStepNum: TextView
              private lateinit var tvTitle: TextView
              private lateinit var tvState: TextView
              private lateinit var tvBody: TextView
              private lateinit var btnAction: Button
              private lateinit var btnBack: Button
              private lateinit var btnNext: Button

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      autoAdvance()
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_setup)

                  tvDots = findViewById(R.id.tvDots)
                  tvStepNum = findViewById(R.id.tvStepNum)
                  tvTitle = findViewById(R.id.tvTitle)
                  tvState = findViewById(R.id.tvState)
                  tvBody = findViewById(R.id.tvBody)
                  btnAction = findViewById(R.id.btnAction)
                  btnBack = findViewById(R.id.btnBack)
                  btnNext = findViewById(R.id.btnNext)

                  steps = listOf(
                      Step(
                          title = "開啟開發人員選項",
                          body = "1. 按下方「前往關於手機」\n\n" +
                              "2. 找到「版本號碼」，連續點 7 次\n" +
                              "　（OPPO / realme：關於本機 → 版本 → 版本號碼）\n" +
                              "　（Samsung：軟體資訊 → 版本號碼）\n" +
                              "　（小米：MIUI / HyperOS 版本）\n\n" +
                              "3. 看到「你已處於開發人員模式」後，按返回鍵回到這裡",
                          button = "前往關於手機",
                          isDone = { SetupUtil.isDeveloperEnabled(this) },
                          action = { SetupUtil.openAboutPhone(this) }
                      ),
                      Step(
                          title = "選取模擬位置應用程式",
                          body = "1. 按下方「設定」，會直接開啟「開發人員選項」\n\n" +
                              "2. 找到「位置」區塊的「選取模擬位置應用程式」\n" +
                              "　（部分手機會自動捲到這一列並標示出來）\n\n" +
                              "3. 點進去，選擇「皮克敏散步助手」\n\n" +
                              "4. 按返回鍵回到這裡，會自動檢查是否完成",
                          button = "設定",
                          isDone = { SetupUtil.isMockAppSelected(this) },
                          action = { SetupUtil.openMockLocationSetting(this) }
                      ),
                      Step(
                          title = "允許位置與通知權限",
                          body = "按下方「允許權限」：\n\n" +
                              "• 位置：選「使用應用程式時允許」，並保持「精確位置」開啟\n\n" +
                              "• 通知：選「允許」，模擬時通知列會顯示狀態與「停止模擬」按鈕\n\n" +
                              "建議另外到手機設定把本 App 的電池用量設為「不限制」，避免背景被關掉。",
                          button = "允許權限",
                          isDone = { SetupUtil.missingPermissions(this).isEmpty() },
                          action = {
                              val need = SetupUtil.missingPermissions(this)
                              if (need.isNotEmpty()) permLauncher.launch(need)
                          }
                      )
                  )

                  index = firstUndone()

                  btnAction.setOnClickListener { steps[index].action() }
                  btnBack.setOnClickListener {
                      if (index > 0) { index--; render() }
                  }
                  btnNext.setOnClickListener {
                      if (index < steps.size - 1) {
                          index++; render()
                      } else {
                          finishSetup()
                      }
                  }
                  render()
              }

              override fun onResume() {
                  super.onResume()
                  autoAdvance()
              }

              /** 目前步驟若已完成，自動跳到下一個未完成的步驟 */
              private fun autoAdvance() {
                  if (steps[index].isDone()) {
                      val next = (index + 1 until steps.size).firstOrNull { !steps[it].isDone() }
                      if (next != null) index = next
                  }
                  render()
              }

              private fun firstUndone(): Int =
                  steps.indexOfFirst { !it.isDone() }.let { if (it < 0) steps.size - 1 else it }

              private fun render() {
                  val step = steps[index]
                  val done = step.isDone()

                  tvDots.text = steps.indices.joinToString(" ") { i ->
                      when {
                          steps[i].isDone() -> "●"
                          i == index -> "◉"
                          else -> "○"
                      }
                  }
                  tvStepNum.text = "步驟 ${index + 1}"
                  tvTitle.text = step.title
                  tvBody.text = step.body

                  tvState.text = if (done) "✓ 已完成" else "尚未完成"
                  tvState.setTextColor(if (done) Color.parseColor("#1B5E20") else Color.parseColor("#5D4037"))
                  tvState.background = GradientDrawable().apply {
                      cornerRadius = 40f
                      setColor(if (done) Color.parseColor("#C5E1A5") else Color.parseColor("#FFE082"))
                  }

                  btnAction.text = if (done) "再次開啟" else step.button
                  btnBack.visibility = if (index > 0) View.VISIBLE else View.INVISIBLE
                  btnNext.text = if (index < steps.size - 1) "下一步" else "完成"
              }

              private fun finishSetup() {
                  if (!SetupUtil.isMockAppSelected(this)) {
                      Toast.makeText(this, "還沒選取模擬位置應用程式，請完成步驟 2", Toast.LENGTH_LONG).show()
                      index = 1; render(); return
                  }
                  if (!SetupUtil.hasLocationPermission(this)) {
                      Toast.makeText(this, "還沒允許位置權限，請完成步驟 3", Toast.LENGTH_LONG).show()
                      index = 2; render(); return
                  }
                  finish()
              }
          }
