name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'__PW_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PikminWalker"
          include(":app")
          __PW_EOF__
          cat > build.gradle.kts <<'__PW_EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __PW_EOF__
          cat > gradle.properties <<'__PW_EOF__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          __PW_EOF__
          mkdir -p app
          cat > app/build.gradle.kts <<'__PW_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.pikminwalker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.pikminwalker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              // OpenStreetMap 地圖，不需要 Google Maps API key
              implementation("org.osmdroid:osmdroid-android:6.1.18")
          }
          __PW_EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__PW_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission
                  android:name="android.permission.ACCESS_MOCK_LOCATION"
                  tools:ignore="MockLocation,ProtectedPermissions" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.PikminWalker"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MockLocationService"
                      android:exported="false"
                      android:foregroundServiceType="location" />
              </application>
          </manifest>
          __PW_EOF__
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'__PW_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">皮克敏散步助手</string>
          </resources>
          __PW_EOF__
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'__PW_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PikminWalker" parent="Theme.Material3.Light.NoActionBar">
                  <item name="colorPrimary">#2E7D32</item>
                  <item name="colorSecondary">#F9A825</item>
              </style>
          </resources>
          __PW_EOF__
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'__PW_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <org.osmdroid.views.MapView
                  android:id="@+id/map"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:layout_margin="8dp"
                  android:background="#E6FFFFFF"
                  android:elevation="4dp"
                  android:padding="10dp"
                  android:text="尚未開始模擬"
                  android:textColor="#222222"
                  android:textSize="13sp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="#F7FFFFFF"
                  android:elevation="8dp"
                  android:orientation="vertical"
                  android:padding="10dp">

                  <com.google.android.material.button.MaterialButtonToggleGroup
                      android:id="@+id/toggleMode"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:checkedButton="@+id/btnModeJump"
                      app:selectionRequired="true"
                      app:singleSelection="true">

                      <Button
                          android:id="@+id/btnModeJump"
